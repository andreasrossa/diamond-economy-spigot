# Builds and tests every push and pull request. Pushing a tag like v0.2.0 also publishes the jar as a
# GitHub release. The tag must match `version` in build.gradle.kts.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java and Gradle versions come from mise.toml.
      - uses: jdx/mise-action@v5

      # Caches Gradle dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in build.gradle.kts"
            exit 1
          fi

      # The database tests start a postgres:16 container; Docker is preinstalled on ubuntu runners.
      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: diamond-econ
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: diamond-econ
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a hyphen (v0.2.0-rc1) are published as pre-releases.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "DiamondEcon $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
