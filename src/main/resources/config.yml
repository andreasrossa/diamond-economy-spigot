# Postgres connection. The defaults match docker-compose.yml.
#
# For Neon (the Vercel integration): paste DATABASE_URL_UNPOOLED (the direct, non-pooled connection
# string of the database's owner role) into `url`; host, port, name, user and password are then ignored.
# To let Neon pause while the server is quiet, set min-idle: 0 and a short idle-timeout-seconds (e.g. 60);
# the first query after a pause takes a moment longer.
database:
  # A connection string, e.g. postgresql://user:password@host/db?sslmode=require. Empty: use the keys below.
  url: ''
  host: localhost
  port: 5432
  name: diamondecon
  user: diamondecon
  password: diamondecon
  # disable, allow, prefer, require, verify-ca or verify-full. Empty: the driver's default (prefer).
  ssl-mode: ''
  pool-size: 4
  # Connections kept open while idle. Defaults to pool-size.
  min-idle: 4
  # How long an idle connection above min-idle stays open (at least 10).
  idle-timeout-seconds: 600
